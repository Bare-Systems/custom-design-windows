name: Inspect legacy website for faithful migration

on:
  push:
    paths: ['.github/workflows/inspect-legacy.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download and inspect original HTML
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --compressed --retry 2 --max-time 45 -A 'Mozilla/5.0' -o /tmp/legacy.html https://www.customdesignwindows.com/
          echo "ORIGINAL_HTML_BYTES=$(wc -c </tmp/legacy.html)"
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urlparse
          from collections import Counter
          class Scanner(HTMLParser):
              def __init__(self):
                  super().__init__();self.urls=[];self.title='';self.in_title=False
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=='title':self.in_title=True
                  if tag in ('script','img','link','a'):
                      u=d.get('src') or d.get('href')
                      if u:self.urls.append((tag,u))
              def handle_endtag(self,tag):
                  if tag=='title':self.in_title=False
              def handle_data(self,data):
                  if self.in_title:self.title+=data
          p=Scanner();p.feed(open('/tmp/legacy.html').read())
          print('TITLE:',p.title)
          print('ASSETS:',len(p.urls))
          print('HOSTS:',Counter(urlparse(u).netloc for _,u in p.urls).most_common(20))
          print('SCRIPTS:', [u for t,u in p.urls if t=='script'][:20])
          print('STYLES:', [u for t,u in p.urls if t=='link' and ('css' in u or 'font' in u)][:25])
          print('IMAGES:', [u for t,u in p.urls if t=='img'][:25])
          print('INTERNAL LINKS:', [u for t,u in p.urls if t=='a' and (u.startswith('/') or 'customdesignwindows.com' in u)][:40])
          print('TOP_HTML:',open('/tmp/legacy.html').read()[:1200])
          PY
