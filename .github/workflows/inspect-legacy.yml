name: Inspect legacy website for faithful migration

on:
  push:
    paths: ['.github/workflows/inspect-legacy.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download and inspect original HTML
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --compressed --retry 2 --max-time 45 -A 'Mozilla/5.0' -o /tmp/legacy.html https://www.customdesignwindows.com/
          echo "ORIGINAL_HTML_BYTES=$(wc -c </tmp/legacy.html)"
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urlparse
          from collections import Counter
          class Scanner(HTMLParser):
              def __init__(self):
                  super().__init__();self.urls=[];self.title='';self.in_title=False
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=='title':self.in_title=True
                  if tag in ('script','img','link','a'):
                      u=d.get('src') or d.get('href')
                      if u:self.urls.append((tag,u))
              def handle_endtag(self,tag):
                  if tag=='title':self.in_title=False
              def handle_data(self,data):
                  if self.in_title:self.title+=data
          p=Scanner();p.feed(open('/tmp/legacy.html').read())
          print('TITLE:',p.title)
          print('ASSETS:',len(p.urls))
          print('HOSTS:',Counter(urlparse(u).netloc for _,u in p.urls).most_common(20))
          print('SCRIPTS:', [u for t,u in p.urls if t=='script'][:20])
          print('STYLES:', [u for t,u in p.urls if t=='link' and ('css' in u or 'font' in u)][:25])
          print('IMAGES:', [u for t,u in p.urls if t=='img'][:25])
          print('INTERNAL LINKS:', [u for t,u in p.urls if t=='a' and (u.startswith('/') or 'customdesignwindows.com' in u)][:40])
          print('TOP_HTML:',open('/tmp/legacy.html').read()[:1200])
          PY
      - name: Inspect application bundles and referenced media
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --compressed --max-time 45 -o /tmp/legacy.js https://www.customdesignwindows.com/assets/index-BIHRFfTN.js
          curl --fail --location --compressed --max-time 45 -o /tmp/legacy.css https://www.customdesignwindows.com/assets/index-ByubpCeI.css
          echo "BUNDLE_BYTES=$(wc -c </tmp/legacy.js) CSS_BYTES=$(wc -c </tmp/legacy.css)"
          python3 - <<'PY'
          import re
          js=open('/tmp/legacy.js').read();css=open('/tmp/legacy.css').read()
          for term in ('Learn about Custom Design Windows','Dale Ellen Iarossi','Since 1984','Est. 1984','gallery','contact','source','lirp.cdn-website.com','assets/','images/','/about','Free Consult','Solar Screen'):
            print('HAS',repr(term),term.lower() in js.lower())
          print('URLS:',re.findall(r'https?://[^"\s<>()]{10,160}',js)[:30])
          print('ASSET_PATHS:',sorted(set(re.findall(r'/(?:assets|images)/[a-zA-Z0-9_./%-]{1,130}',js)))[:65])
          print('IMAGE_NAMES:',sorted(set(re.findall(r'[a-zA-Z0-9_.%-]+\.(?:png|jpg|jpeg|svg|webp)',js)))[:70])
          print('CSS_FONTS:',re.findall(r'url\([^)]{1,150}\)',css)[:20])
          print('JS_HEADER:',js[:160])
          PY
      - name: Inspect router and paths in compiled bundle
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --compressed -o /tmp/routes.js https://www.customdesignwindows.com/assets/index-BIHRFfTN.js
          python3 - <<'PY'
          import re
          js=open('/tmp/routes.js').read()
          for needle in ['path:"/"','path:"/about"','path:"/gallery"','to:"/about"','href:"/about"','pathname','basename','BrowserRouter','createBrowserRouter','/about','/contact','/gallery','/reviews','/_site','Link','Navigate','RouterProvider','useRoutes']:
            idx=js.find(needle)
            print('ROUTE',repr(needle),idx, 'SAMPLE', js[max(0,idx-200):idx+240] if idx>=0 else '')
          print('ALL_ABOUT_CONTEXTS', [js[max(0,m.start()-80):m.start()+90] for m in list(re.finditer('/about',js))[:10]])
          PY
