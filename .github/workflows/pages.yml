name: Mirror and deploy original website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: custom-design-windows-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify contact Worker contract
        run: node --test worker/index.test.js
      - name: Test production-domain routing and API contract
        env:
          SITE_BASE: /
          CONTACT_API_URL: https://api.customdesignwindows.com/api/contact
        run: |
          python3 scripts/build-mirror.py
          python3 scripts/test-mirror.py
      - name: Build original website for GitHub Pages
        env:
          SITE_BASE: ${{ vars.SITE_BASE || '/custom-design-windows/' }}
          CONTACT_API_URL: ${{ vars.CONTACT_API_URL || '' }}
          ALLOW_INDEXING: ${{ vars.ALLOW_INDEXING || '0' }}
        run: |
          python3 scripts/build-mirror.py
          python3 scripts/test-mirror.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
