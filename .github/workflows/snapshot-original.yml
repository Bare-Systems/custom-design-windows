name: Capture original website assets

on:
  push:
    paths:
      - 'scripts/import-original.py'
      - '.github/workflows/snapshot-original.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-original-website
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Capture current public website
        run: python3 scripts/import-original.py
      - name: Commit versioned HTML, JS, CSS, and images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/legacy/
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
            exit 0
          fi
          git commit -m "Vendor original Custom Design Windows website snapshot"
          git push origin HEAD:main
